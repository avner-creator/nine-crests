<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nine Crests - Beat the Dragon!</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1430; }
  #gl { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
  #ui { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  #errbox { position: fixed; left: 8px; bottom: 8px; max-width: 60%; background: #c62828; color: #fff; font: 12px Consolas, monospace;

  #nowebgl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; background: #2a1f48;
    color: #fff; font: bold 26px "Trebuchet MS", sans-serif; text-align: center; padding: 30px; }
  #testlog { display: none; }
  #testsum { position: fixed; right: 6px; bottom: 6px; z-index: 11; font: bold 12px Consolas, monospace; color: #fff; background: rgba(0,0,0,.65);
    padding: 3px 6px; border-radius: 4px; display: none; max-width: 45%; white-space: pre-wrap; }
</style>
</head>
